[package]
authors = ["MaidSafe Developers <dev@maidsafe.net>"]
description = "Safe Network EVM"
edition = "2024"
homepage = "https://autonomi.com"
license = "MIT OR Apache-2.0"
name = "evmlib"
repository = "https://github.com/WithAutonomi/evmlib"
version = "0.9.1"

[features]
default = ["native"]
# Local wallets, RPC execution, environment discovery, and Anvil processes.
# Payment types, hashing, pricing, and Merkle verification are always portable.
native = ["rpc", "alloy/node-bindings"]
# HTTP RPC and wallet operations use browser fetch when targeting WASM.
rpc = ["alloy/contract", "alloy/json-rpc", "alloy/network", "alloy/provider-http", "alloy/reqwest-rustls-tls", "alloy/rpc-client", "alloy/rpc-types", "alloy/signer-local", "dep:tokio", "dep:exponential-backoff"]
external-signer = ["rpc"]

[dependencies]
alloy = { version = "1.0.32", default-features = false, features = ["std", "serde"] }
serde = "1"
serde_with = { version = "3.11.0", features = ["macros"] }
thiserror = "1.0"
tracing = { version = "~0.1.26" }
tokio = { version = "1.43.1", features = ["sync", "time"], optional = true }
rand = "0.8.5"
exponential-backoff = { version = "2.0.0", optional = true }
hex = "~0.4.3"
xor_name = "5"
rmp-serde = "1"
tiny-keccak = { version = "~2.0.2", features = ["sha3"] }
ant-merkle = "1.5.1"

url = "2"
web-time = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs-next = "~2.0"
serde_json = "1.0.108"
