[profile.default]
src = "contracts"
out = "artifacts"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
# The committed artifacts/PaymentVaultV2.json was built with these. Pinned so a
# rebuild (and the contracts.yml drift check) reproduces its bytecode instead of
# picking up whatever solc / EVM version Foundry defaults to that day.
solc_version = "0.8.28"
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
